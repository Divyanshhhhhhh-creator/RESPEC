version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ..
            - npm install --ignore-scripts
            - npm run build --workspace=contracts
            - cd web
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../node_modules/**/*
